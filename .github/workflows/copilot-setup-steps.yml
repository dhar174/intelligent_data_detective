name: copilot-setup-steps

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  no-key-validation:
    name: No-key validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            flake8 \
            numpy \
            pandas \
            pydantic \
            typing_extensions \
            langchain \
            langchain-core \
            langchain-openai \
            langgraph

      - name: Run no-key unit and integration tests
        run: python -m pytest test_validate_run.py tests/unit tests/integration -q

      - name: Lint validation scripts
        run: >
          python -m flake8
          validate_run.py
          validate_artifact_quality.py
          test_validate_run.py
          --max-line-length=120
          --extend-ignore=E203,W503
